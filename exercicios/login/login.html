<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
               background-image: linear-gradient(90deg, dimgray, darkgrey);                         
        }
        
        div {
            background-color: rgba(0, 0, 0.8);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 80px;
            border-radius: 20px;
            color: white;
        }

        input  {
            padding: 15px;
            border: none;
            outline: none;
            font-size: 15px;
        }

        button  {
            background-color: darkgray;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 10px;
            color: white;
            font-size: 15px;
           /* cursor: pointer; */
        }

        button:hover  {
            background-color: darkolivegreen;

        }
       
    </style>
</head>
<body>
    <div>
        <h1>Login</h1>
        <input type="text" placeholder="nome">
        <br><br>
        <input type="password" placeholder="senha">
        <br><br>
        <button>Enviar</button>
    </div>

    <!-- Aprenda como criar uma TELA de LOGIN com HTML e CSS-->
</body>
</html>
